<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button[disabled] { opacity: .6; cursor: progress; }
    #result p { margin: .5rem 0; }
    #result p strong { display: block; }
    #result p.draft { white-space: pre-wrap; }
    #result p.notice { padding-left: .75rem; border-left: .25rem solid currentColor; }
    #result p.notice strong { display: inline; margin-right: .25rem; }
    #result p.error { color: #a4262c; }
    #result p.warning { color: #8a4b00; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite"></div>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");
    const submitButton = form.querySelector("button");

    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    // Every submit takes a sequence number; only the newest one may render.
    let requestSeq = 0;
    let inFlight = null;

    function render(nodes) {
      result.replaceChildren(...nodes);
    }

    function paragraph(className) {
      const node = document.createElement("p");
      if (className) node.className = className;
      return node;
    }

    function strong(text) {
      const node = document.createElement("strong");
      node.textContent = text;
      return node;
    }

    function labelled(className, labelText, valueText) {
      const node = paragraph(className);
      node.append(strong(labelText), document.createTextNode(valueText));
      return node;
    }

    function notice(className, title, text) {
      const node = paragraph(["notice", className].filter(Boolean).join(" "));
      if (title) node.append(strong(title));
      if (text) node.append(document.createTextNode(text));
      return node;
    }

    function showReady(topic, draft) {
      render([
        labelled(null, "Тема", TOPIC_LABELS[topic] ?? topic),
        labelled("draft", "Черновик ответа", draft),
      ]);
    }

    function showNotice(className, title, text) {
      render([notice(className, title, text)]);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const id = ++requestSeq;
      inFlight?.abort();
      const controller = new AbortController();
      inFlight = controller;

      // The previous draft must not survive into a new attempt.
      showNotice(null, null, "Разбираем заявку…");
      submitButton.disabled = true;

      try {
        let reply;
        try {
          reply = await fetch("/api/triage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: message.value }),
            signal: controller.signal,
          });
        } catch {
          if (id !== requestSeq) return;
          showNotice(
            "error",
            "Нужен ручной разбор.",
            "Сервис недоступен — прочитайте текст и ответьте клиенту сами.",
          );
          return;
        }

        let payload = null;
        try {
          payload = await reply.json();
        } catch {
          payload = null;
        }

        if (id !== requestSeq) return;

        if (reply.status === 400 && payload?.status === "invalid_input") {
          showNotice("warning", "Введите текст заявки.", "");
          return;
        }

        if (!reply.ok || !payload || typeof payload !== "object") {
          showNotice(
            "error",
            "Нужен ручной разбор.",
            "Сервис вернул неожиданный ответ — прочитайте текст и ответьте клиенту сами.",
          );
          return;
        }

        if (
          payload.status === "ready" &&
          typeof payload.draft === "string" &&
          payload.draft.trim() !== ""
        ) {
          showReady(payload.topic, payload.draft);
          return;
        }

        showNotice(
          "warning",
          "Нужен ручной разбор.",
          "AI не смог разобрать заявку. Прочитайте текст и ответьте клиенту сами.",
        );
      } finally {
        if (id === requestSeq) submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
